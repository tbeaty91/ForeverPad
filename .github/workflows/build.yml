name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the in-box .NET Framework compiler
        shell: cmd
        run: build.bat ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverPad
          path: ForeverPad.exe
      - name: Publish release (the app's updater reads the latest one)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} ForeverPad.exe --title "ForeverPad ${{ github.ref_name }}" --generate-notes
